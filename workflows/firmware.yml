name: Firmware (ESP32-C3)

on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [gogen_pcf, gogen_gpio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Build
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
      - name: Merge factory image (flash na 0x0)
        working-directory: firmware
        run: |
          B=.pio/build/${{ matrix.env }}
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32c3 merge_bin \
            -o ${{ matrix.env }}_factory.bin \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
          cp $B/firmware.bin ${{ matrix.env }}_app.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/${{ matrix.env }}_factory.bin
            firmware/${{ matrix.env }}_app.bin
